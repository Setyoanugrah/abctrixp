name: smby

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */6 * * *"

concurrency:
  group: smby
  cancel-in-progress: true

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Install edge client
        run: |
          curl -sL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: cold start guard
        run: sleep 45

      - name: Serve
        env:
          SMBY_EDGE_TOKEN: ${{ secrets.SMBY_EDGE_TOKEN }}
          SMBY_TOKEN: ${{ secrets.SMBY_TOKEN }}
          SMBY_PROXY: ${{ secrets.SMBY_PROXY }}
        run: |
          cloudflared tunnel --no-autoupdate run --token "$SMBY_EDGE_TOKEN" > /tmp/cf.log 2>&1 &
          timeout 20700 xvfb-run -a -s "-screen 0 1366x800x24" python3 -u server.py

      - name: relaunch
        if: always()
        env:
          TOKEN: ${{ secrets.SMBY_GH_TOKEN }}
        run: |
          sleep 5
          curl -s -o /dev/null -w "relaunch %{http_code}\n" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/serve.yml/dispatches \
            -d '{"ref":"main"}'
